<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Stylized Flame & Heart Motif (Center 512x512) -->
  <g transform="translate(0, -6)">
    <!-- Outer ambient glow aura -->
    <path d="M256 100 C275 160 350 200 350 285 C350 355 305 400 256 400 C207 400 162 355 162 285 C162 220 225 170 240 130 Z" 
          fill="#f43f5e" opacity="0.25" filter="url(#glow)" />

    <!-- Main Outer Flame -->
    <path d="M256 100 C280 170 360 215 360 295 C360 360 312 402 256 402 C200 402 152 360 152 295 C152 225 220 175 238 128 C244 114 252 104 256 100 Z" 
          fill="url(#flameGrad)" />

    <!-- Stylized Heart Negative / Inner flame cutout -->
    <path d="M256 360 C256 360 200 315 200 268 C200 242 220 224 242 224 C250 224 254 228 256 232 C258 228 262 224 270 224 C292 224 312 242 312 268 C312 315 256 360 256 360 Z" 
          fill="url(#innerGrad)" />

    <!-- Core Sparkle -->
    <polygon points="256,245 260,265 280,269 260,273 256,293 252,273 232,269 252,265" fill="#ffffff" opacity="0.95" />
    
    <!-- Wingman Star Accent -->
    <polygon points="340,140 344,152 356,156 344,160 340,172 336,160 324,156 336,152" fill="#fbbf24" />
  </g>
</svg>
